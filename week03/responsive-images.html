<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <meta name="author" content="Christian Mavinga">
    <meta name="description" content="Design responsive images to support smaller page weights and deliver content based on screen size.">
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <header>
        <h1>Responsive Images</h1>
    </header>
    <main>
    <div class="hero">
        <picture>
            <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
            <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
            <img src="images/hero-small.webp" alt="Small picture of Kinshasa DRC Temple" width="500" height="250">
        </picture>
    </div>
    </main> 
</body>
</html>
